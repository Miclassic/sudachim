<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>НА МНЕ — примерь не покупая</title>
<style>
:root{--bg:#FBF3F0;--ink:#2A2024;--gray:#9A8A90;--acc:#E77C8D;--acc2:#C95D70}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink)}
header{padding:16px;text-align:center}
h1{font-size:22px;letter-spacing:3px;font-weight:800;color:var(--acc2)}
.sub{color:var(--gray);font-size:12px;margin-top:4px}
main{max-width:560px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:12px}
.step{background:#fff;border-radius:20px;padding:14px;box-shadow:0 8px 24px rgba(42,32,36,.08)}
.step h3{font-size:13px;font-weight:800;margin-bottom:10px}
.step h3 b{color:var(--acc2)}
.btn{border:none;border-radius:999px;padding:12px 16px;font-weight:700;font-size:13px;cursor:pointer}
.btn.acc{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}
.btn.soft{background:#F3E7EA;color:var(--acc2)}
input[type=file]{display:none}
canvas{width:100%;border-radius:20px;background:#fff;box-shadow:0 12px 34px rgba(42,32,36,.12);touch-action:none}
.hint{color:var(--gray);font-size:11px;margin-top:6px;line-height:1.4}
.row{display:flex;gap:8px;align-items:center}
.row label{font-size:11px;color:var(--gray);width:70px}
input[type=range]{flex:1}
</style>
</head>
<body>
<header><h1>НА МНЕ</h1><div class="sub">надень своё лицо на модель с фото товара — примерь не покупая</div></header>
<main>
  <div class="step"><h3><b>1</b> Фото товара (с моделью)</h3>
    <button class="btn soft" onclick="$('prod').click()">🛍 загрузить с телефона</button>
    <input type="file" id="prod" accept="image/*" onchange="onProd(this)">
    <div class="hint">Сделай скриншот карточки Ozon/WB, где вещь надета на модель.</div>
  </div>
  <div class="step"><h3><b>2</b> Твоё лицо</h3>
    <button class="btn soft" onclick="$('face').click()">📷 загрузить фото</button>
    <input type="file" id="face" accept="image/*" onchange="onFace(this)">
    <div class="hint">Потом потяни лицо пальцем прямо на холсте — поставь на голову модели. Ползунками подгони размер и мягкость краёв.</div>
    <div class="row" style="margin-top:8px"><label>размер</label><input type="range" id="size" min="30" max="220" value="90" oninput="face.r=+this.value;draw()"></div>
    <div class="row"><label>мягкость</label><input type="range" id="feath" min="10" max="90" value="55" oninput="face.f=+this.value/100;draw()"></div>
  </div>
  <canvas id="cv" width="720" height="960"></canvas>
  <div class="row">
    <button class="btn acc" onclick="share()">📤 Поделиться</button>
    <button class="btn soft" onclick="dl()">⬇ Скачать</button>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
let base=null,faceImg=null;
let face={x:360,y:200,r:90,f:.55};
function loadImg(s){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s;});}
async function onProd(i){const f=i.files[0];if(f){base=await loadImg(URL.createObjectURL(f));draw();}}
async function onFace(i){const f=i.files[0];if(f){faceImg=await loadImg(URL.createObjectURL(f));draw();}}
function draw(){
  const cv=$('cv'),x=cv.getContext('2d'),W=cv.width,H=cv.height;
  x.clearRect(0,0,W,H);x.fillStyle='#fff';x.fillRect(0,0,W,H);
  if(base){const s=Math.min(W/base.width,H/base.height),iw=base.width*s,ih=base.height*s;x.drawImage(base,(W-iw)/2,(H-ih)/2,iw,ih);}
  if(faceImg)drawFace(x);
}
function drawFace(x){
  const r=face.r,d=r*2,off=document.createElement('canvas');off.width=off.height=d;
  const o=off.getContext('2d'),s=Math.max(d/faceImg.width,d/faceImg.height);
  o.drawImage(faceImg,(d-faceImg.width*s)/2,(d-faceImg.height*s)/2,faceImg.width*s,faceImg.height*s);
  o.globalCompositeOperation='destination-in';
  const g=o.createRadialGradient(r,r,r*(1-face.f),r,r,r);
  g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
  o.fillStyle=g;o.fillRect(0,0,d,d);
  x.drawImage(off,face.x-r,face.y-r);
}
// перетаскивание лица пальцем
let drag=null;
const cv=$('cv');
cv.addEventListener('pointerdown',e=>{const p=pos(e);drag={dx:face.x-p.x,dy:face.y-p.y};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e);face.x=p.x+drag.dx;face.y=p.y+drag.dy;draw();});
cv.addEventListener('pointerup',()=>drag=null);
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(cv.width/r.width),y:(e.clientY-r.top)*(cv.height/r.height)};}
function blob(){return new Promise(r=>$('cv').toBlob(r,'image/png'));}
async function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(await blob());a.download='na-mne.png';a.click();}
async function share(){const b=await blob();const f=new File([b],'na-mne.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:'Примерила на НА МНЕ — не покупая'});return;}catch(e){}}dl();}
draw();
</script>
</body>
</html>
